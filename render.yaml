services:
  - type: web
    name: wire-harness
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: AI_MODE
        value: mock
      - key: CAMERA_MODE
        value: mock
      - key: FRONTEND_URL
        value: https://wire-harness-rho.vercel.app,http://localhost:5173,http://127.0.0.1:5173
