services:
  postgres:
    image: postgres:17-alpine
    profiles: ["production-db"]
    environment:
      POSTGRES_DB: wire_harness_inspection
      POSTGRES_USER: inspection_user
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspection_user -d wire_harness_inspection"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
